<div class="container py-4">
  <h2 class="mb-4">Upcoming events</h2>

  <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
    @for (event of events; track event.title) {
      <div class="col">
        <div class="card h-100 shadow-sm">
          @if (event.imageUrl) {
            <img [src]="event.imageUrl" class="card-img-top object-fit-cover" style="height: 180px" [alt]="event.title" />
          } @else {
            <div class="card-img-top bg-secondary-subtle d-flex align-items-center justify-content-center fs-1" style="height: 180px">🏐</div>
          }

          <div class="card-body">
            <h5 class="card-title mb-1">{{ event.title }}</h5>
            <span class="badge text-bg-primary mb-2">some date</span>
            <p class="card-text text-body-secondary small mb-2">📍 {{ event.location }}</p>
            <p class="card-text">{{ event.description }}</p>
          </div>

          <div class="card-footer bg-transparent border-top-0">
            <button type="button" class="btn btn-outline-primary btn-sm">View details</button>
          </div>
        </div>
      </div>
    } @empty {
      <p class="text-body-secondary">No events yet.</p>
    }
  </div>
</div>
